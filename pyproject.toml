[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigml"
version = "0.1.0"
description = "Audit learned taxonomies against a Lean-verified concept spec"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "nltk>=3.8",
]

[project.scripts]
sigml = "sigml.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
